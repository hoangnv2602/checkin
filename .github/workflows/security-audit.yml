# .github/workflows/security-audit.yml
#
# I-701 — Run tools/scripts/security-audit.sh trên PR + weekly.
# Fail CI nếu pnpm/dotnet audit trả về critical CVE.
name: security-audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly — phát hiện CVE mới giữa các release
    - cron: "0 7 * * 1"

permissions:
  contents: read

jobs:
  audit:
    name: dep + container audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile=false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Setup Flutter 3.44
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.0"

      - name: Run security audit
        run: bash tools/scripts/security-audit.sh
