# .github/workflows/ci.yml — I-005
# CI matrix cho 5 service + contracts. Chạy song song (independent jobs).
# Trigger: push to develop + PR to main/develop.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: 1
  PNPM_VERSION: 9.12.0
  NODE_VERSION: 22

jobs:
  # ─────────────────────────────────────────────────────────────────
  # web (tenant-facing Next.js)
  # ─────────────────────────────────────────────────────────────────
  web:
    name: apps/web
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saas-checkin/web lint
      - run: pnpm --filter @saas-checkin/web typecheck
      - run: pnpm --filter @saas-checkin/web test
      - run: pnpm --filter @saas-checkin/web build
      - name: Install Playwright browsers
        run: pnpm --filter @saas-checkin/web exec playwright install --with-deps chromium
      - name: Run Playwright e2e
        run: pnpm --filter @saas-checkin/web e2e
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-web
          path: apps/web/playwright-report
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────
  # checkin-admin (platform-owner Next.js, D12)
  # ─────────────────────────────────────────────────────────────────
  checkin-admin:
    name: apps/checkin-admin
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saas-checkin/checkin-admin lint
      - run: pnpm --filter @saas-checkin/checkin-admin typecheck
      - run: pnpm --filter @saas-checkin/checkin-admin test
      - run: pnpm --filter @saas-checkin/checkin-admin build

  # ─────────────────────────────────────────────────────────────────
  # api-gateway (NestJS 11 BFF)
  # ─────────────────────────────────────────────────────────────────
  api-gateway:
    name: apps/api-gateway
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_checkin_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7
        ports: [6379:6379]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: ${{ env.PNPM_VERSION }} }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: bufbuild/buf-action@v1
        with: { setup_only: true }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @saas-checkin/api-gateway lint
      - run: pnpm --filter @saas-checkin/api-gateway typecheck
      - run: pnpm --filter @saas-checkin/api-gateway test
      - run: pnpm --filter @saas-checkin/api-gateway test:e2e
      - run: pnpm --filter @saas-checkin/api-gateway build
      - run: buf lint packages/proto

  # ─────────────────────────────────────────────────────────────────
  # core-api (.NET 10 DDD)
  # ─────────────────────────────────────────────────────────────────
  core-api:
    name: apps/core-api
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: saas_checkin_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore apps/core-api/SaasCheckin.sln
      - name: Format check
        run: dotnet format apps/core-api/SaasCheckin.sln --verify-no-changes
      - name: Build
        run: dotnet build apps/core-api/SaasCheckin.sln --no-restore --configuration Release
      - name: Test
        run: dotnet test apps/core-api/SaasCheckin.sln --no-build --configuration Release --logger trx --collect-coverage

  # ─────────────────────────────────────────────────────────────────
  # mobile (Flutter)
  # ─────────────────────────────────────────────────────────────────
  mobile:
    name: apps/mobile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.6.x
          channel: stable
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Install melos
        run: dart pub global activate melos
      - name: Bootstrap
        run: melos bootstrap
      - name: Analyze
        run: melos run analyze
      - name: Test
        run: melos run test

  # ─────────────────────────────────────────────────────────────────
  # contracts (proto + OpenAPI)
  # ─────────────────────────────────────────────────────────────────
  contracts:
    name: contracts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: bufbuild/buf-action@v1
      - run: buf lint packages/proto
      - run: buf build packages/proto --as-file-descriptor-set -o /tmp/proto.bin
      # OpenAPI diff check (sau khi NestJS export được — Phase 1)

  # ─────────────────────────────────────────────────────────────────
  # Build images (cuối, sau khi tất cả pass)
  # ─────────────────────────────────────────────────────────────────
  images:
    name: Build container images
    runs-on: ubuntu-24.04
    needs: [web, checkin-admin, api-gateway, core-api, mobile, contracts]
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    strategy:
      fail-fast: false
      matrix:
        service: [web, checkin-admin, api-gateway, core-api]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.service }}
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max
