<!doctype html>
<html>
<body style="font-family: sans-serif; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h1 style="color: #18181b;">See you {{ relativeTime }}!</h1>
  <p>{{ eventTitle }} is coming up.</p>
  <p>
    <a href="{{ ticketUrl }}"
       style="display: inline-block; padding: 12px 24px; background: #6366f1; color: white; border-radius: 6px; text-decoration: none;">
      Open my QR ticket
    </a>
  </p>
  <p style="margin-top: 32px; color: #71717a; font-size: 12px;">{{ orgName }} via SaasCheckin.</p>
</body>
</html>
