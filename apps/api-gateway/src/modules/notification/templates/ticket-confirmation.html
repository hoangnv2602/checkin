<!doctype html>
<html>
<body style="font-family: sans-serif; max-width: 560px; margin: 0 auto; padding: 24px;">
  <h1 style="color: #18181b;">Hi {{ attendeeName }},</h1>
  <p>Your registration for <strong>{{ eventTitle }}</strong> is confirmed.</p>
  <table style="margin: 16px 0; border-collapse: collapse;">
    <tr><td style="padding: 4px 12px 4px 0; color: #71717a;">When</td><td><strong>{{ eventStartAt }}</strong></td></tr>
    <tr><td style="padding: 4px 12px 4px 0; color: #71717a;">Venue</td><td>{{ venue }}</td></tr>
  </table>
  <p>
    <a href="{{ ticketUrl }}"
       style="display: inline-block; padding: 12px 24px; background: #6366f1; color: white; border-radius: 6px; text-decoration: none;">
      View QR ticket
    </a>
  </p>
  <p style="margin-top: 32px; color: #71717a; font-size: 12px;">Sent by {{ orgName }} via SaasCheckin.</p>
</body>
</html>
