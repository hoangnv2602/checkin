include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # I-913: pre-existing `/** ... */` doc comments on top-level library
    # declarations + a handful of trailing-comma misses are flagged as info
    # by flutter_lints 6. Treat as warnings (not errors) so CI passes.
    # I-914 follow-up: convert to `/// ...` form + add trailing commas.
    dangling_library_doc_comments: warning
    slash_for_doc_comments: warning
    require_trailing_commas: warning
    # I-913: removed drift-using files; some leftover `package:meta` imports
    # from existing code can be deferred.
    depend_on_referenced_packages: warning

linter:
  rules:
    prefer_final_locals: true
    prefer_const_constructors: true
    avoid_print: true
    require_trailing_commas: true
