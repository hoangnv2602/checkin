name: saas_checkin_mobile
description: "Multi-tenant event check-in mobile app (staff)."
publish_to: 'none'
version: 0.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.6.0'

dependencies:
  flutter:
    sdk: flutter

  # State management — D9: BLoC + Cubit
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.5

  # Routing
  go_router: ^14.6.2

  # Networking
  dio: ^5.7.0
  retrofit: ^4.4.1
  grpc: ^4.0.1             # I-801: gRPC client to api-gateway :50052
  protobuf: ^4.0.0         # I-801: proto message runtime

  # Local DB
  drift: ^2.21.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.27

  # QR scanning
  mobile_scanner: ^5.2.3

  # Ed25519 (offline verify)
  basic_utils: ^5.6.0

  # Audio + haptic feedback
  audioplayers: ^6.1.0

  # Background sync
  workmanager: ^0.9.0+3

  # Observability
  sentry_flutter: ^8.13.0

  # Misc
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  intl: ^0.19.0
  shared_preferences: ^2.3.3
  flutter_secure_storage: ^9.2.2
  meta: ^1.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  drift_dev: ^2.21.0
  freezed: ^2.5.7
  json_serializable: ^6.8.0
  retrofit_generator: ^9.1.5

# I-913: pin analyzer to a version compatible with drift_dev (>=6.0.0 <8.0.0).
# bloc_test 9.x was removed because its analyzer constraint is disjoint with
# drift_dev. Tests should use flutter_test directly (I-914 will re-add bloc_test
# via a proper dep strategy).
dependency_overrides:
  analyzer: 7.4.0
  # dart_style in pub cache is broken with analyzer 7.x; force a working pair.
  dart_style: 3.1.3

flutter:
  uses-material-design: true
