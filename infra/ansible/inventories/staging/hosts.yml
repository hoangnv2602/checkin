---
# Staging inventory — I-017, I-018
# I-017 sẽ tạo 3 VPS: htz-app-1 (CCX23), htz-db-1 (CCX13), htz-staging-1 (CX22).
# IP public sẽ thay sau khi Hetzner provision xong (chạy bằng Terraform hoặc
# `hcloud server create` qua Ansible hetzner.cloud collection).

all:
  vars:
    ansible_python_interpreter: /usr/bin/python3
    environment: staging
  children:
    app:
      hosts:
        htz-staging-1:
          ansible_host: PLACEHOLDER_IP   # update sau khi hcloud create
    db:
      hosts:
        htz-db-1:
          ansible_host: PLACEHOLDER_IP
    all_vps:
      children:
        app:
        db:
